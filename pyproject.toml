[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tokcleanse"
version = "0.1.0"
authors = [
  { name = "Peter Schneider-Kamp" }
]
description = "Utilities for token cleaning workflows."
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "brainsurgery",
    "jinja2",
    "numpy",
    "tqdm",
    "typer",
    "transformers",
]

[project.scripts]
tokcleanse = "tokcleanse.cli:main"

[project.optional-dependencies]
dev = ["build", "mypy", "pre-commit", "pytest", "pytest-xdist", "ruff", "twine"]

[project.urls]
"Homepage" = "https://github.com/schneiderkamplab/tokcleanse"
"Bug Tracker" = "https://github.com/schneiderkamplab/tokcleanse/issues"

[tool.hatch.build]
include = [
    "tokcleanse",
    "README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.13"
files = ["tokcleanse", "tests"]
exclude = "^(examples/|test_.*\\.py$)"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = false
